<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A5C42" />

    <!-- SEO padrão da home. A pré-renderização substitui estas tags por rota. -->
    <title>Transacione | Transação tributária federal (PGFN) e estadual (PGE-SP)</title>
    <meta
      name="description"
      content="Sua dívida tributária pode custar menos. Aferimos a classificação usada pela PGFN e pela PGE-SP, pedimos revisão quando cabível e estruturamos a transação. Diagnóstico técnico em 48 horas."
    />
    <link rel="canonical" href="https://www.transacione.com.br" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Transacione" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Transacione | Transação tributária federal (PGFN) e estadual (PGE-SP)"
    />
    <meta
      property="og:description"
      content="A classificação que define o seu desconto é presumida por sistema. A lei permite corrigi-la. Diagnóstico técnico em 48 horas."
    />
    <meta property="og:url" content="https://www.transacione.com.br" />
    <meta property="og:image" content="https://www.transacione.com.br/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      href="/fonts/newsreader-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      CSS crítico embutido: pinta o fundo e a primeira dobra antes de a folha
      principal chegar, evitando flash e reduzindo o LCP.
    -->
    <style>
      html {
        background: #f7f6f2;
      }
      body {
        margin: 0;
        background: #f7f6f2;
        color: #14201c;
        font-family:
          "InterVar", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Rede de segurança: se por qualquer motivo (navegador muito antigo, bloqueio
      de rede/antivírus, erro de execução) nada conseguir preencher #root em alguns
      segundos, mostra uma mensagem simples com contato — em vez de página em branco.
      Script clássico (não type="module"), roda em qualquer navegador.
    -->
    <script>
      (function () {
        function vazio() {
          var r = document.getElementById("root");
          return !r || r.childElementCount === 0;
        }
        setTimeout(function () {
          if (!vazio()) return;
          var d = document.createElement("div");
          d.setAttribute(
            "style",
            "max-width:560px;margin:15vh auto;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#14201c;text-align:center;line-height:1.5;"
          );
          d.innerHTML =
            '<p style="font-size:17px;margin:0 0 12px">Não conseguimos carregar a página no seu navegador.</p>' +
            '<p style="font-size:15px;color:#555;margin:0 0 20px">Tente atualizar o app do navegador (ou o WebView do sistema) e recarregar. Se preferir, fale com a gente:</p>' +
            '<p style="margin:0"><a href="https://wa.me/5511940000000" style="color:#0A5C42;font-weight:600;text-decoration:underline">Falar no WhatsApp</a> · <a href="mailto:contato@transacione.com.br" style="color:#0A5C42;font-weight:600;text-decoration:underline">contato@transacione.com.br</a></p>';
          document.body.appendChild(d);
        }, 4000);
      })();
    </script>
  </body>
</html>

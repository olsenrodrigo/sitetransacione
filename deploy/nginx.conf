# Carregar dentro do contexto http do Nginx (sites-enabled).
log_format transacione_timing '$remote_addr - $time_iso8601 "$request" $status $body_bytes_sent '
    'rt=$request_time upstream=$upstream_response_time tls=$ssl_protocol '
    '"$http_referer" "$http_user_agent"';

server {
    server_name transacione.com.br www.transacione.com.br;

    # Diagnóstico opt-in pelo link ?suporte=acesso; sem cookies ou corpo de formulário.
    access_log /var/log/nginx/transacione-access.log transacione_timing;
    error_log /var/log/nginx/transacione-error.log warn;

    location = /__suporte/acesso.gif {
        access_log /var/log/nginx/transacione-support.log combined;
        add_header Cache-Control "no-store";
        return 204;
    }

    root /var/www/sitetransacione/current/public;
    index index.html;

    # Páginas e assets não dependem do processo Node nem de buffers do proxy.
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location ~ /\. {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3027;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/ld+json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.transacione.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.transacione.com.br/privkey.pem; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.transacione.com.br-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.transacione.com.br-rsa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot





}
server {
    if ($host = transacione.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.transacione.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name transacione.com.br www.transacione.com.br;
    return 404; # managed by Certbot




}